name: ARacerXTune
options:
  bundleIdPrefix: id.co.cuprum
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ARacerKit:
    path: ../ARacerKit
  ConnectIQ:
    url: https://github.com/garmin/connectiq-companion-app-sdk-ios
    from: "1.8.0"
targets:
  ARacerXTune:
    type: application
    platform: iOS
    sources:
      - ARacerXTune
    dependencies:
      - package: ARacerKit
        product: ARacerKit
      - package: ConnectIQ
        product: ConnectIQ
    info:
      path: ARacerXTune/Info.plist
      properties:
        CFBundleDisplayName: MotoTune
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Terhubung ke ECU aRacer lewat Wi-Fi bridge."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
          - bluetooth-central
        # Garmin Connect IQ companion: return URL scheme + GCM detection + BLE usage strings
        CFBundleURLTypes:
          - CFBundleURLName: id.co.cuprum.mototune.ciq
            CFBundleURLSchemes:
              - mototune-ciq
        LSApplicationQueriesSchemes:
          - gcm-ciq
        NSBluetoothAlwaysUsageDescription: "Talks to your Garmin watch (MotoTune Ride) for live data and feel markers."
        NSBluetoothPeripheralUsageDescription: "Talks to your Garmin watch (MotoTune Ride) for live data and feel markers."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIAppFonts:
          - SpaceGrotesk.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.co.cuprum.aracerxtune
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "TQGF64HS7F"
