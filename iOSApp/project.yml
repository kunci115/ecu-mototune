name: ARacerXTune
options:
  bundleIdPrefix: id.co.cuprum
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ARacerKit:
    path: ../ARacerKit
targets:
  ARacerXTune:
    type: application
    platform: iOS
    sources:
      - ARacerXTune
    dependencies:
      - package: ARacerKit
        product: ARacerKit
    info:
      path: ARacerXTune/Info.plist
      properties:
        CFBundleDisplayName: MotoTune
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Terhubung ke ECU aRacer lewat Wi-Fi bridge."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIAppFonts:
          - SpaceGrotesk.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.co.cuprum.aracerxtune
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "TQGF64HS7F"
